run-name: MeSH keyword reproduction (${{ github.event.inputs.dataset_rows || '5000' }} records)

name: Run clinical-trial reproduction

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-reproduction.yml"
      - "dataset-run-trigger.txt"
  workflow_dispatch:
    inputs:
      dataset_rows:
        description: "Number of MeSH-labelled trial records to download"
        required: true
        default: "5000"
        type: choice
        options:
          - "5000"
          - "20000"
          - "55634"

permissions:
  contents: read

jobs:
  reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATASET_ROWS: ${{ github.event.inputs.dataset_rows || '5000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile project
        run: python -m compileall -q src ml scripts app
      - name: Offline smoke test
        run: python scripts/smoke_test_reference.py
      - name: Download source records
        run: |
          python scripts/download_hf_sample.py \
            --rows "$DATASET_ROWS" \
            --out data/clinical_trials_${DATASET_ROWS}.csv \
            --seed 42
      - name: Train and evaluate reference-aligned model
        run: |
          python scripts/run_reference_model.py \
            --input data/clinical_trials_${DATASET_ROWS}.csv \
            --min-doc-freq 5 \
            --max-terms 134 \
            --epochs 5 \
            --batch-size 10000 \
            --seed 42
      - name: Upload measured experiment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clinical-trial-reproduction-${{ github.event.inputs.dataset_rows || '5000' }}
          if-no-files-found: error
          path: |
            results/reference_metrics.csv
            results/reference_experiment.json
            output/reference_model.pkl
            output/mesh_vocab.json
